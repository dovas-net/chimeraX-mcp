[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimerax-mcp"
version = "0.4.0"
description = "MCP server for UCSF ChimeraX molecular visualization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "ChimeraX MCP Contributors"}
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
chimerax-mcp = "chimerax_mcp.cli:main"
chimerax-mcp-core = "chimerax_mcp.core_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
